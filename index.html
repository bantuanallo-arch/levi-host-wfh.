<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Host Live - Levi Strauss & Co</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background-color: #c41230; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 24px; letter-spacing: 2px; }
        .container { padding: 20px; max-width: 500px; margin: auto; background: white; margin-top: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #c41230; color: white; border: none; padding: 15px; width: 100%; margin-top: 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #a00f28; }
        footer { text-align: center; padding: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<header>LEVI STRAUSS & CO.</header>

<div class="container">
    <h2>Formulir Pendaftaran Host Live (WFH)</h2>
    <p style="text-align: center; font-size: 14px; color: #666;">Bergabunglah bersama tim retail kami dari rumah.</p>
    
    <form>
        <label>Nama Lengkap</label>
        <input type="text" placeholder="Masukkan nama sesuai KTP">

        <label>Username TikTok/Shopee</label>
        <input type="text" placeholder="@username_kamu">

        <label>Pengalaman Live</label>
        <select>
            <option>Belum Pernah</option>
            <option>Kurang dari 1 Tahun</option>
            <option>Lebih dari 1 Tahun</option>
        </select>

        <label>Nomor WhatsApp</label>
        <input type="tel" placeholder="081234567xxx">

        <button type="button" onclick="alert('Pendaftaran Berhasil Terkirim!')">DAFTAR SEKARANG</button>
    </form>
</div>

<footer>
    &copy; 2026 Levi Strauss & Co. | Recruitment Team
</footer>

</body>
          </html>
